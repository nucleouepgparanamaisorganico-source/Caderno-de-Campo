<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f8a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">

<body>
<title>Caderno de Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: uma pergunta por tela, botões enormes, cada seção com sua cor (como as abas do caderno de papel).
   Tema claro fixo de propósito: alto contraste para uso no sol. */
:root{
  --papel:#fbf8ef; --tinta:#1f2a1c; --tinta-suave:#4a5646; --linha:#d9d3bf;
  --folha:#4f8a3a; --folha-escura:#2f5e22; --folha-clara:#e3f0d6;
  --sol:#f2b632; --terra:#9a5b2e; --ceu:#2f7fb8; --abobora:#e26b1f; --rubi:#c23a3a; --uva:#7a4ea3; --agua:#1f8f86;
  --branco:#ffffff; --microfone:#d93636;
  --f-titulo:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-texto:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --raio:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:22px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ceu);outline-offset:3px}
#app{max-width:640px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}

/* topo */
.topo{display:flex;align-items:center;gap:12px}
.topo h1{font-family:var(--f-titulo);font-weight:800;font-size:1.6rem;line-height:1.05;margin:0;flex:1;text-wrap:balance}
.topo h1 small{display:block;font-family:var(--f-texto);font-weight:400;font-size:.8rem;color:var(--tinta-suave)}
.btn-redondo{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--tinta);background:var(--branco);font-size:1.8rem;display:grid;place-items:center;padding:0}
.btn-redondo.falando{background:var(--sol);animation:pulso 1s infinite}
@keyframes pulso{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.btn-redondo.falando,.mic.ouvindo{animation:none}}

/* início */
.ola{background:var(--folha-clara);border-radius:var(--raio);padding:16px 18px;display:flex;gap:12px;align-items:center}
.ola p{margin:0;flex:1;font-size:1.05rem}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bloco{position:relative;border:0;border-radius:var(--raio);min-height:170px;padding:14px 12px 16px;color:var(--branco);background:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.bloco:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bloco .ico{font-size:3.4rem;line-height:1}
.bloco .nome{font-family:var(--f-titulo);font-weight:800;font-size:1.3rem;line-height:1.05}
.bloco .qtd{font-size:.8rem;opacity:.95}
.bloco.claro{color:var(--tinta)}
.bloco-ouvir{position:absolute;top:8px;right:8px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:1.4rem;color:var(--tinta);display:grid;place-items:center;padding:0}
.largo{grid-column:1/-1;min-height:120px;padding-right:64px;padding-left:64px}

/* pergunta */
.faixa{border-radius:var(--raio);background:var(--c);color:var(--branco);padding:12px 16px;display:flex;align-items:center;gap:12px}
.faixa.claro{color:var(--tinta)}
.faixa .ico{font-size:2.2rem}
.faixa b{font-family:var(--f-titulo);font-size:1.25rem;flex:1}
.passos{display:flex;gap:6px}
.passos i{flex:1;height:10px;border-radius:5px;background:var(--linha)}
.passos i.feito{background:var(--c)}
.pergunta{display:flex;gap:12px;align-items:flex-start}
.pergunta h2{font-family:var(--f-titulo);font-weight:800;font-size:1.75rem;line-height:1.1;margin:4px 0 0;flex:1;text-wrap:balance}
.dica{margin:0;color:var(--tinta-suave);font-size:1rem}
.campo{width:100%;min-height:96px;border:3px solid var(--tinta);border-radius:18px;background:var(--branco);padding:14px 16px;font-size:1.5rem;resize:vertical}
.campo.curto{min-height:0;height:76px}
.linha-mic{display:flex;gap:12px;align-items:stretch}
.mic{flex:1;border:0;border-radius:18px;background:var(--microfone);color:var(--branco);font-family:var(--f-titulo);font-weight:800;font-size:1.4rem;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:84px}
.mic .ico{font-size:2rem}
.mic.ouvindo{animation:pulso 1s infinite;background:var(--tinta)}
.apagar-campo{flex:none;width:84px;border:3px solid var(--tinta);border-radius:18px;background:var(--branco);font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.apagar-campo span{font-size:1.6rem}
.aviso{background:#fff3cd;border:2px solid var(--sol);border-radius:14px;padding:10px 14px;font-size:1rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--tinta);background:var(--branco);border-radius:999px;padding:10px 18px;font-size:1.15rem;font-weight:700;min-height:56px}
.chip.marcado{background:var(--c);color:var(--branco);border-color:var(--c)}
.chip.rec::before{content:"↺ ";opacity:.6}
.datas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.datas .chip{border-radius:18px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.datas .chip small{font-weight:400;font-size:.85rem}
.outro-dia{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.outro-dia input{border:3px solid var(--tinta);border-radius:14px;padding:12px;font-size:1.3rem;background:var(--branco)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:2px solid var(--linha);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.rodape .dentro{max-width:640px;margin:0 auto;display:flex;gap:12px}
.nav{flex:1;min-height:76px;border-radius:18px;font-family:var(--f-titulo);font-weight:800;font-size:1.35rem;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--tinta);background:var(--branco)}
.nav.ir{flex:1.6;background:var(--folha);border-color:var(--folha-escura);color:var(--branco)}
.nav.salvar{background:var(--folha-escura);border-color:var(--folha-escura);color:var(--branco)}

/* revisão e lista */
.cartao{background:var(--branco);border:2px solid var(--linha);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.par{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--linha);padding-bottom:10px}
.par:last-child{border-bottom:0;padding-bottom:0}
.par div{flex:1;min-width:0}
.par small{display:block;color:var(--tinta-suave);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.par span{font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.par span.vazio{font-weight:400;color:var(--tinta-suave)}
.mini{flex:none;min-width:56px;height:56px;border-radius:14px;border:2px solid var(--tinta);background:var(--branco);font-size:1.4rem;padding:0 10px}
.mini.txt{font-size:.95rem;font-weight:700}
.registro .cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.registro .cab b{flex:1 1 110px;min-width:0;font-family:var(--f-titulo);font-size:1.3rem;line-height:1.1}
.registro .cab b small{display:block;font-family:var(--f-texto);font-weight:400;font-size:.9rem;color:var(--tinta-suave)}
.registro .acoes{display:flex;gap:8px;margin-left:auto}
.registro p{margin:0;font-size:1.05rem}
.apagar-sim{background:var(--rubi);color:var(--branco);border-color:var(--rubi)}
.nuvem{font-size:.85rem;color:var(--tinta-suave)}
.vazio-lista{text-align:center;color:var(--tinta-suave);padding:24px 8px}
.vazio-lista .ico{font-size:4rem;display:block}
.grande-btn{border:0;border-radius:var(--raio);background:var(--c,var(--folha));color:var(--branco);font-family:var(--f-titulo);font-weight:800;font-size:1.4rem;min-height:84px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}
.grande-btn.claro{color:var(--tinta)}
.grande-btn .ico{font-size:2rem}
.contorno{background:var(--branco);color:var(--tinta);border:3px solid var(--tinta)}
.pronto{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-top:20px}
.pronto .ico{font-size:6rem;line-height:1}
.pronto h2{font-family:var(--f-titulo);font-size:2.2rem;margin:0}
.dica-cartao{background:var(--branco);border-left:10px solid var(--agua);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.dica-cartao p{margin:0;flex:1;font-size:1.1rem}
.config label{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.config input[type=url],.config input[type=text]{border:2px solid var(--tinta);border-radius:12px;padding:12px;font-size:1rem;background:var(--branco);width:100%}
.config .lado{display:flex;align-items:center;gap:12px;font-size:1.1rem}
.config .lado input{width:32px;height:32px}
.status{font-size:1rem;margin:0}
textarea.export{width:100%;height:140px;font-size:.8rem;font-family:ui-monospace,monospace;border:2px solid var(--linha);border-radius:12px;padding:8px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.foto{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--linha);border:2px solid var(--tinta)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:50%;border:0;background:var(--rubi);color:var(--branco);font-size:1.3rem;padding:0}
.foto-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto-btns label{cursor:pointer;flex-direction:column;gap:4px;font-size:1.2rem;text-align:center}
.mini-foto{flex:none;width:64px;height:64px;border-radius:12px;object-fit:cover;border:2px solid var(--linha);background:var(--linha)}
.fotos-linha{display:flex;gap:8px;flex-wrap:wrap}
.fotos-linha img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--linha)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div id="app" aria-live="polite"></div>
<div class="rodape" id="rodape" hidden><div class="dentro" id="rodape-dentro"></div></div>

/* ---------- armazenamento local (funciona sem internet) ---------- */
var CHAVE="caderno-campo-v1";
var dados={perfil:{},registros:[],recentes:{},config:{url:"",lerSempre:true},dispositivo:""};
function carregar(){try{var t=localStorage.getItem(CHAVE);if(t){var d=JSON.parse(t);for(var k in d)dados[k]=d[k];}}catch(e){}
  if(!dados.dispositivo)dados.dispositivo="cel-"+Math.random().toString(36).slice(2,10);}
function guardar(){try{localStorage.setItem(CHAVE,JSON.stringify(dados));}catch(e){}}
carregar();

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function sec(id){for(var i=0;i<SECOES.length;i++)if(SECOES[i].id===id)return SECOES[i];}
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diaMenos(n){var d=new Date();d.setDate(d.getDate()-n);return d;}
function dataDeIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dataFala(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return s||"";var d=dataDeIso(s);return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();}
function dataCurta(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return s||"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function vazio(v){return!v||(Array.isArray(v)&&!v.length);}
function nFotos(v){var n=(v||[]).length;return n?n+(n>1?" fotos":" foto"):"";}
function valorTela(c,v){return c.foto?nFotos(v):c.data?dataCurta(v):v;}
function valorFala(c,v){return c.foto?nFotos(v):c.data?dataFala(v):v;}
function copia(o){return JSON.parse(JSON.stringify(o||{}));}
function primeiroTexto(s){return s.campos.filter(function(c){return!c.foto;})[0];}
function campoFoto(s){return s.campos.filter(function(c){return c.foto;})[0];}

/* ---------- fotos: guardadas no celular (IndexedDB), reduzidas para ~150 KB ---------- */
var fotoCache={},fotoBanco=null;
function abrirBanco(){if(fotoBanco)return fotoBanco;fotoBanco=new Promise(function(ok){
  try{var r=indexedDB.open("caderno-fotos",1);r.onupgradeneeded=function(){r.result.createObjectStore("fotos");};
    r.onsuccess=function(){ok(r.result);};r.onerror=function(){ok(null);};}catch(e){ok(null);}});return fotoBanco;}
function fotoPut(id,url){fotoCache[id]=url;return abrirBanco().then(function(db){if(!db)return;return new Promise(function(ok){
  try{var t=db.transaction("fotos","readwrite");t.objectStore("fotos").put(url,id);t.oncomplete=t.onerror=function(){ok();};}catch(e){ok();}});});}
function fotoGet(id){if(fotoCache[id])return Promise.resolve(fotoCache[id]);return abrirBanco().then(function(db){if(!db)return null;return new Promise(function(ok){
  try{var q=db.transaction("fotos").objectStore("fotos").get(id);q.onsuccess=function(){if(q.result)fotoCache[id]=q.result;ok(q.result||null);};q.onerror=function(){ok(null);};}catch(e){ok(null);}});});}
function fotoDel(id){delete fotoCache[id];abrirBanco().then(function(db){if(!db)return;try{db.transaction("fotos","readwrite").objectStore("fotos").delete(id);}catch(e){}});}
function fotosDe(ids){return Promise.all((ids||[]).map(fotoGet)).then(function(a){return a.filter(Boolean);});}
function comprimir(file){return new Promise(function(ok,erro){var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var m=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,m/Math.max(w,h)),cv=document.createElement("canvas");
    cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);ok(cv.toDataURL("image/jpeg",.72));};
  img.onerror=function(){URL.revokeObjectURL(url);erro(new Error("imagem"));};img.src=url;});}
function preencherFotos(){document.querySelectorAll("img[data-foto]").forEach(function(im){fotoGet(im.dataset.foto).then(function(u){if(u)im.src=u;});});}
function imgFoto(id,cls){return'<img'+(cls?' class="'+cls+'"':'')+' data-foto="'+esc(id)+'" alt="Foto">';}

/* ---------- leitura em voz alta ---------- */
var tts=window.speechSynthesis||null,vozPt=null,botaoFalando=null;
function escolherVoz(){if(!tts)return;var vs=tts.getVoices();vozPt=vs.filter(function(v){return/pt[-_]BR/i.test(v.lang);})[0]||vs.filter(function(v){return/^pt/i.test(v.lang);})[0]||null;}
if(tts){escolherVoz();tts.onvoiceschanged=escolherVoz;}
function calar(){if(tts)tts.cancel();if(botaoFalando){botaoFalando.classList.remove("falando");botaoFalando=null;}}
function falar(texto,botao){
  if(!tts||!texto)return;
  var mesmo=botao&&botao===botaoFalando;calar();if(mesmo)return;
  var u=new SpeechSynthesisUtterance(texto);u.lang="pt-BR";u.rate=.9;if(vozPt)u.voice=vozPt;
  if(botao){botao.classList.add("falando");botaoFalando=botao;}
  u.onend=u.onerror=function(){if(botao)botao.classList.remove("falando");if(botaoFalando===botao)botaoFalando=null;};
  tts.speak(u);
}
var falas=[];function f(t){falas.push(t);return falas.length-1;}
function btnOuvir(texto,cls){return '<button class="'+(cls||"btn-redondo")+'" data-falar="'+f(texto)+'" aria-label="Ouvir">🔊</button>';}

/* ---------- ditado (voz vira texto) ---------- */
var Reconhecer=window.SpeechRecognition||window.webkitSpeechRecognition||null,rec=null,ouvindo=false;
function pararDitado(){if(rec){try{rec.stop();}catch(e){}}ouvindo=false;var b=$(".mic");if(b){b.classList.remove("ouvindo");b.querySelector(".txt").textContent="Falar";}}
function ditar(){
  var campo=$("#resposta"),b=$(".mic");
  if(ouvindo){pararDitado();return;}
  if(!Reconhecer){avisoMic("Este celular não escreve por voz aqui. Toque na caixa branca e use o microfone 🎤 do teclado.");return;}
  calar();
  rec=new Reconhecer();rec.lang="pt-BR";rec.interimResults=true;rec.continuous=false;
  var base=campo.value?campo.value.replace(/\s+$/,"")+" ":"";
  rec.onresult=function(ev){var t="";for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    t=t.charAt(0).toUpperCase()+t.slice(1);campo.value=base+t;rascunho[campoAtual().k]=campo.value;};
  rec.onerror=function(ev){
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed")avisoMic("O microfone está bloqueado. Permita o microfone ou use o microfone 🎤 do teclado.");
    else if(ev.error==="network")avisoMic("Sem internet a voz não vira texto por aqui. Use o microfone 🎤 do teclado ou escreva.");
    else if(ev.error==="no-speech")avisoMic("Não ouvi nada. Toque em Falar e fale perto do celular.");
    pararDitado();};
  rec.onend=pararDitado;
  try{rec.start();ouvindo=true;b.classList.add("ouvindo");b.querySelector(".txt").textContent="Pode falar… (toque para parar)";}
  catch(e){avisoMic("Não consegui ligar o microfone. Use o microfone 🎤 do teclado.");}
}
function avisoMic(msg){var a=$("#aviso-mic");if(a){a.textContent=msg;a.hidden=false;}falar(msg.replace("🎤",""));}

/* ---------- navegação ---------- */
var tela={nome:"inicio"},rascunho={},confirmaApagar=null;
function ir(t){pararDitado();calar();tela=t;confirmaApagar=null;render();window.scrollTo(0,0);
  if(t.nome==="pergunta"&&dados.config.lerSempre)setTimeout(function(){var b=$(".pergunta .btn-redondo");if(b)b.click();},250);}
function campoAtual(){return sec(tela.secao).campos[tela.passo];}
function registrosDe(id){return dados.registros.filter(function(r){return r.secao===id;});}

function rodape(html){var r=$("#rodape");if(!html){r.hidden=true;return;}r.hidden=false;$("#rodape-dentro").innerHTML=html;}

function render(){
  falas=[];var h="",s;
  if(tela.nome==="inicio"){
    var nome=(dados.perfil.nome||"").split(" ")[0];
    var boas=nome?"Olá, "+nome+"! O que você fez hoje na roça?":"Olá! Toque num quadro para anotar no seu caderno.";
    h+='<div class="topo"><h1>Caderno de Campo<small>Produção orgânica · '+new Date().getFullYear()+'</small></h1><button class="btn-redondo" data-ir="config" aria-label="Ajustes">⚙️</button></div>';
    h+='<div class="ola"><p>'+esc(boas)+'</p>'+btnOuvir(boas+" Toque no alto-falante de cada quadro para ouvir o que ele é.")+'</div>';
    h+='<div class="grade">';
    var p=sec("perfil");
    h+='<button class="bloco claro largo" style="--c:var(--sol)" data-abrir="perfil"><span class="ico">'+p.ico+'</span><span class="nome">'+p.nome+'</span><span class="qtd">'+(dados.perfil.nome?esc(dados.perfil.nome):"Comece por aqui")+'</span><span class="bloco-ouvir" role="button" tabindex="0" data-falar="'+f(p.fala)+'" aria-label="Ouvir">🔊</span></button>';
    SECOES.forEach(function(x){if(x.unico||x.grupo)return;var n=registrosDe(x.id).length;
      h+='<button class="bloco'+(x.claro?" claro":"")+'" style="--c:var('+x.cor+')" data-abrir="'+x.id+'"><span class="ico">'+x.ico+'</span><span class="nome">'+esc(x.nome)+'</span><span class="qtd">'+(n?n+(n>1?" anotações":" anotação"):"nada anotado")+'</span>'+
        '<span class="bloco-ouvir" role="button" tabindex="0" data-falar="'+f(x.fala)+'" aria-label="Ouvir">🔊</span></button>';});
    var nn=registrosDe("notas-compra").length+registrosDe("notas-venda").length;
    h+='<button class="bloco largo" style="--c:var(--tinta-suave)" data-ir="notas"><span class="ico">🧾</span><span class="nome">Notas fiscais</span><span class="qtd">'+(nn?nn+(nn>1?" notas":" nota"):"compras e vendas")+'</span><span class="bloco-ouvir" role="button" tabindex="0" data-falar="'+f("Notas fiscais. Guarde a foto das notas de compra e das notas de venda.")+'" aria-label="Ouvir">🔊</span></button>';
    h+='<button class="bloco largo" style="--c:var(--agua)" data-ir="dicas"><span class="ico">💡</span><span class="nome">Dicas agroecológicas</span><span class="bloco-ouvir" role="button" tabindex="0" data-falar="'+f("Dicas agroecológicas. Toque para ouvir dicas para cuidar do solo e das plantas.")+'" aria-label="Ouvir">🔊</span></button>';
    h+='</div>';
    var pend=dados.registros.filter(function(r){return!r.enviado;}).length;
    if(dados.config.url)h+='<p class="nuvem">'+(pend?"☁️ "+pend+" anotação(ões) esperando internet para enviar.":"☁️ Tudo enviado para a planilha.")+'</p>';
    rodape("");
  }
  else if(tela.nome==="lista"){
    s=sec(tela.secao);var regs=registrosDe(s.id).slice().reverse();
    h+=faixa(s,s.nome);
    h+='<button class="grande-btn'+(s.claro?" claro":"")+'" style="--c:var('+s.cor+')" data-novo="'+s.id+'"><span class="ico">➕</span> Anotar novo</button>';
    if(!regs.length)h+='<div class="vazio-lista"><span class="ico">'+s.ico+'</span>Nada anotado ainda.<br>Toque em <b>Anotar novo</b>.</div>';
    regs.forEach(function(r){
      var c0=primeiroTexto(s),cf=campoFoto(s),fs=cf?(r.campos[cf.k]||[]):[],dataC=s.campos.filter(function(c){return c.data;})[0];
      var titulo=r.campos[c0.k]||"(sem nome)";if(c0.data)titulo=dataCurta(titulo);
      var sub=dataC&&dataC!==c0?dataCurta(r.campos[dataC.k]):"";
      var leitura=s.campos.map(function(c){var v=r.campos[c.k];return!vazio(v)?c.r+": "+valorFala(c,v)+".":"";}).join(" ");
      var resumo=s.campos.filter(function(c){return c!==c0&&c!==dataC&&!c.foto&&r.campos[c.k];}).map(function(c){return esc(r.campos[c.k]);}).join(" · ");
      h+='<div class="cartao registro"><div class="cab">'+(fs.length?imgFoto(fs[0],"mini-foto"):'')+'<b>'+esc(titulo)+(sub?'<small>'+esc(sub)+'</small>':'')+(fs.length>1?'<small>📷 '+fs.length+' fotos</small>':'')+'</b><span class="acoes">'+btnOuvir(leitura,"mini")+
        '<button class="mini" data-editar="'+r.id+'" aria-label="Mudar">✏️</button>'+
        (confirmaApagar===r.id?'<button class="mini txt apagar-sim" data-apagar-sim="'+r.id+'">Sim, apagar</button>':'<button class="mini" data-apagar="'+r.id+'" aria-label="Apagar">🗑️</button>')+
        '</span></div>'+(resumo?'<p>'+resumo+'</p>':'')+(dados.config.url?'<span class="nuvem">'+(r.enviado?"☁️ enviado":"⏳ esperando internet")+'</span>':'')+'</div>';});
    rodape(s.grupo?'<button class="nav" data-ir="notas">◀ Notas</button><button class="nav" data-ir="inicio">🏠 Início</button>':'<button class="nav" data-ir="inicio">🏠 Início</button>');
  }
  else if(tela.nome==="notas"){
    h+='<div class="faixa" style="--c:var(--tinta-suave)"><span class="ico">🧾</span><b>Notas fiscais</b><button class="btn-redondo" data-ir="inicio" aria-label="Início" style="width:56px;height:56px;font-size:1.5rem">🏠</button></div>';
    var expl="Guarde aqui as notas fiscais. Tire uma foto de cada nota. Toque em Compras para as notas do que você comprou, ou em Vendas para as notas do que você vendeu.";
    h+='<div class="ola"><p>Tire uma foto de cada nota e guarde aqui.</p>'+btnOuvir(expl)+'</div>';
    ["notas-compra","notas-venda"].forEach(function(id){var x=sec(id),n=registrosDe(id).length;
      h+='<button class="bloco largo" style="--c:var('+x.cor+')" data-abrir="'+id+'"><span class="ico">'+x.ico+'</span><span class="nome">'+(id==="notas-compra"?"Compras":"Vendas")+'</span><span class="qtd">'+(n?n+(n>1?" notas":" nota"):"nenhuma nota")+'</span><span class="bloco-ouvir" role="button" tabindex="0" data-falar="'+f(x.fala)+'" aria-label="Ouvir">🔊</span></button>';});
    rodape('<button class="nav" data-ir="inicio">🏠 Início</button>');
  }
  else if(tela.nome==="pergunta"){
    s=sec(tela.secao);var c=campoAtual(),v=rascunho[c.k]||"";
    h+=faixa(s,s.nome);
    h+='<div class="passos" style="--c:var('+s.cor+')">'+s.campos.map(function(_,i){return'<i class="'+(i<=tela.passo?"feito":"")+'"></i>';}).join("")+'</div>';
    var leitura=c.p+(c.dica?" "+c.dica:"")+(c.foto?" Toque em tirar foto, ou escolha uma foto que já está no celular.":c.data?" Toque em hoje, ontem, ou escolha outro dia.":" Toque no microfone vermelho e fale, ou escreva.");
    h+='<div class="pergunta"><h2 id="rot">'+esc(c.p)+'</h2>'+btnOuvir(leitura)+'</div>';
    if(c.dica)h+='<p class="dica">'+esc(c.dica)+'</p>';
    if(c.foto){
      var ids=Array.isArray(v)?v:[];
      if(ids.length)h+='<div class="fotos">'+ids.map(function(id){return'<div class="foto">'+imgFoto(id)+'<button data-tirar-foto="'+esc(id)+'" aria-label="Tirar esta foto">✕</button></div>';}).join("")+'</div>';
      if(ids.length<MAX_FOTOS)h+='<div class="foto-btns"><label class="grande-btn'+(s.claro?" claro":"")+'" style="--c:var('+s.cor+')"><span class="ico">📷</span>Tirar foto<input type="file" accept="image/*" capture="environment" class="sr" data-arquivo></label>'+
        '<label class="grande-btn contorno"><span class="ico">🖼️</span>Da galeria<input type="file" accept="image/*" multiple class="sr" data-arquivo></label></div>';
      else h+='<p class="dica">Já tem '+MAX_FOTOS+' fotos. Para trocar, toque no ✕ de uma delas.</p>';
      h+='<p class="aviso" id="aviso-foto" hidden></p>';
    } else if(c.data){
      var op=[[0,"Hoje"],[1,"Ontem"],[2,"Anteontem"]];
      h+='<div class="datas" style="--c:var('+s.cor+')">'+op.map(function(o){var d=diaMenos(o[0]),i=iso(d);
        return'<button class="chip'+(v===i?" marcado":"")+'" data-data="'+i+'">'+o[1]+'<small>'+DIAS[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+'</small></button>';}).join("")+'</div>';
      h+='<label class="outro-dia">Outro dia:<input type="date" id="resposta-data" value="'+esc(/^\d{4}/.test(v)?v:"")+'" max="'+iso(new Date())+'"></label>';
      if(v)h+='<p class="aviso" style="background:var(--folha-clara);border-color:var(--folha)">Escolhido: <b>'+esc(dataFala(v))+'</b></p>';
    } else {
      h+='<textarea id="resposta" class="campo'+(c.curto?" curto":"")+'" aria-labelledby="rot" '+(c.tel?'inputmode="tel"':c.num?'inputmode="decimal"':'')+' placeholder="Escreva ou fale aqui">'+esc(v)+'</textarea>';
      h+='<div class="linha-mic"><button class="mic" data-ditar><span class="ico">🎤</span><span class="txt">Falar</span></button><button class="apagar-campo" data-limpar><span>⌫</span>Apagar</button></div>';
      h+='<p class="aviso" id="aviso-mic" hidden></p>';
      var rec2=(dados.recentes[s.id+"."+c.k]||[]);
      var lista=rec2.concat((c.chips||[]).filter(function(x){return rec2.indexOf(x)<0;})).slice(0,10);
      if(lista.length)h+='<div class="chips" style="--c:var('+s.cor+')">'+lista.map(function(x){
        return'<button class="chip'+(rec2.indexOf(x)>=0?" rec":"")+(v===x?" marcado":"")+'" data-chip="'+esc(x)+'">'+esc(x)+'</button>';}).join("")+'</div>';
    }
    var ultimo=tela.passo===s.campos.length-1;
    rodape('<button class="nav" data-voltar>◀ Voltar</button><button class="nav ir" data-proximo>'+(ultimo?"Conferir ✔":"Próximo ▶")+'</button>');
  }
  else if(tela.nome==="revisao"){
    s=sec(tela.secao);
    var tudo=s.campos.map(function(c){var v=rascunho[c.k];return c.r+": "+(!vazio(v)?valorFala(c,v):(c.foto?"nenhuma":"não preenchido"))+".";}).join(" ");
    h+=faixa(s,s.nome);
    h+='<div class="pergunta"><h2>Está tudo certo?</h2>'+btnOuvir("Está tudo certo? "+tudo+" Se estiver certo, toque em Salvar. Para mudar, toque no lápis.")+'</div>';
    h+='<div class="cartao">'+s.campos.map(function(c,i){var v=rascunho[c.k],tem=!vazio(v);
      var conteudo=c.foto&&tem?'<span class="fotos-linha">'+v.map(function(id){return imgFoto(id);}).join("")+'</span>':'<span class="'+(tem?"":"vazio")+'">'+esc(tem?valorTela(c,v):(c.foto?"nenhuma foto":"não preenchido"))+'</span>';
      return'<div class="par"><div><small>'+esc(c.r)+'</small>'+conteudo+'</div>'+
        (tem&&!c.foto?btnOuvir(c.r+": "+valorFala(c,v),"mini"):"")+'<button class="mini" data-passo="'+i+'" aria-label="Mudar">✏️</button></div>';}).join("")+'</div>';
    rodape('<button class="nav" data-voltar>◀ Voltar</button><button class="nav salvar" data-salvar>✔ Salvar</button>');
    if(dados.config.lerSempre)setTimeout(function(){var b=$(".pergunta .btn-redondo");if(b&&!botaoFalando)b.click();},250);
  }
  else if(tela.nome==="pronto"){
    s=sec(tela.secao);
    h+='<div class="pronto"><span class="ico">✅</span><h2>Pronto!</h2><p>Ficou anotado no seu caderno.</p>'+btnOuvir("Pronto! Ficou anotado no seu caderno.")+'</div>';
    if(!s.unico)h+='<button class="grande-btn'+(s.claro?" claro":"")+'" style="--c:var('+s.cor+')" data-novo="'+s.id+'"><span class="ico">➕</span> Anotar outro</button>';
    h+='<button class="grande-btn contorno" data-ir="inicio"><span class="ico">🏠</span> Voltar ao início</button>';
    rodape("");
  }
  else if(tela.nome==="dicas"){
    h+='<div class="faixa" style="--c:var(--agua)"><span class="ico">💡</span><b>Dicas agroecológicas</b></div>';
    h+='<div class="dica-cartao" style="border-left-color:var(--folha)"><p>'+esc(SOBRE)+'</p>'+btnOuvir(SOBRE,"mini")+'</div>';
    h+='<button class="grande-btn" style="--c:var(--agua)" data-falar="'+f("Na natureza, tudo ocorre por uma razão. É preciso entender o que o nosso solo e as nossas plantas estão tentando nos dizer. "+DICAS.join(" "))+'"><span class="ico">🔊</span> Ouvir todas as dicas</button>';
    DICAS.forEach(function(d){h+='<div class="dica-cartao"><p>'+esc(d)+'</p>'+btnOuvir(d,"mini")+'</div>';});
    rodape('<button class="nav" data-ir="inicio">🏠 Início</button>');
  }
  else if(tela.nome==="config"){
    var pend2=dados.registros.filter(function(r){return!r.enviado;}).length;
    h+='<div class="faixa" style="--c:var(--tinta-suave)"><span class="ico">⚙️</span><b>Ajustes</b></div>';
    h+='<div class="cartao config"><label class="lado"><input type="checkbox" id="ler-sempre" '+(dados.config.lerSempre?"checked":"")+'> Ler cada pergunta em voz alta sozinho</label></div>';
    h+='<div class="cartao config"><b>Enviar para a planilha</b><p class="status">Quem acompanha o agricultor cola aqui o endereço da planilha. As anotações ficam guardadas no celular e são enviadas quando houver internet.</p>'+
      '<label>Endereço da planilha (Apps Script)<input type="url" id="url-planilha" value="'+esc(dados.config.url)+'" placeholder="https://script.google.com/macros/s/.../exec"></label>'+
      '<button class="grande-btn" data-sincronizar><span class="ico">☁️</span> Enviar agora</button><p class="status" id="status-envio">'+pend2+' anotação(ões) ainda não enviadas.</p></div>';
    h+='<div class="cartao config"><b>Cópia das anotações</b><p class="status">Todas as anotações em formato de planilha (CSV).</p><textarea class="export" id="csv" readonly>'+esc(gerarCSV())+'</textarea>'+
      '<div class="chips"><button class="chip" data-copiar>Copiar</button><a class="chip" id="baixar" download="caderno-de-campo.csv" href="#">Baixar arquivo</a></div></div>';
    rodape('<button class="nav" data-ir="inicio">🏠 Início</button>');
  }
  $("#app").innerHTML=h;
  preencherFotos();
  var a=$("#baixar");if(a&&/claude\.ai|claudeusercontent/.test(location.host)){a.hidden=true;a=null;}if(a){try{a.href=URL.createObjectURL(new Blob(["﻿"+gerarCSV()],{type:"text/csv"}));}catch(e){}}
}
function faixa(s,t){return'<div class="faixa'+(s.claro?" claro":"")+'" style="--c:var('+s.cor+')"><span class="ico">'+s.ico+'</span><b>'+esc(t)+'</b><button class="btn-redondo" data-ir="inicio" aria-label="Início" style="width:56px;height:56px;font-size:1.5rem">🏠</button></div>';}

/* ---------- ações ---------- */
function abrir(id){var s=sec(id);if(s.unico){rascunho=copia(dados.perfil);ir(dados.perfil.nome?{nome:"revisao",secao:id}:{nome:"pergunta",secao:id,passo:0});}else ir({nome:"lista",secao:id});}
function novo(id){rascunho={};tela.editando=null;ir({nome:"pergunta",secao:id,passo:0});}
function lerCampo(){var t=$("#resposta");if(t)rascunho[campoAtual().k]=t.value.trim();}
function salvar(){
  var s=sec(tela.secao);
  s.campos.forEach(function(c){var v=rascunho[c.k];if(!v||c.data||c.foto)return;var k=s.id+"."+c.k,l=dados.recentes[k]||[];
    l=[v].concat(l.filter(function(x){return x!==v;})).slice(0,4);if(v.length<=28)dados.recentes[k]=l;});
  if(s.unico){dados.perfil=Object.assign({},rascunho);dados.perfilAlterado=true;}
  else if(tela.editando){var r=dados.registros.filter(function(x){return x.id===tela.editando;})[0];if(r){r.campos=Object.assign({},rascunho);r.enviado=false;r.alterado=new Date().toISOString();}}
  else dados.registros.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),secao:s.id,campos:Object.assign({},rascunho),criado:new Date().toISOString(),enviado:false});
  guardar();var id=s.id;rascunho={};ir({nome:"pronto",secao:id});sincronizar();
}
function gerarCSV(){
  var linhas=[["Seção","Data do registro"].concat(["Campo 1","Campo 2","Campo 3","Campo 4","Campo 5"])];
  var p=sec("perfil");linhas.push(["Meus dados",""].concat(p.campos.map(function(c){return c.r+": "+valorTela(c,dados.perfil[c.k]||"");})));
  dados.registros.forEach(function(r){var s=sec(r.secao);linhas.push([s.nome,r.criado.slice(0,10)].concat(s.campos.map(function(c){return c.r+": "+valorTela(c,r.campos[c.k]||"");})));});
  return linhas.map(function(l){return l.map(function(x){return'"'+String(x).replace(/"/g,'""')+'"';}).join(";");}).join("\n");
}
var enviando=false;
function sincronizar(manual){
  var st=$("#status-envio");
  if(!dados.config.url){if(manual&&st)st.textContent="Cole o endereço da planilha primeiro.";return;}
  if(enviando)return;
  var fila=dados.registros.filter(function(r){return!r.enviado;}),total=fila.length,feitos=0;
  if(!total&&!dados.perfilAlterado){if(st)st.textContent="Tudo já foi enviado.";return;}
  if(!navigator.onLine){if(st)st.textContent="Sem internet agora. Envio automático quando a internet voltar.";return;}
  enviando=true;if(st)st.textContent="Enviando…";
  var pf=campoFoto(sec("perfil")),perfil=copia(dados.perfil);delete perfil[pf.k];
  function enviar(corpo){corpo.dispositivo=dados.dispositivo;corpo.perfil=perfil;
    return fetch(dados.config.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(corpo)})
      .then(function(r){return r.json();}).then(function(res){if(!res||!res.ok)throw new Error(res&&res.erro||"erro");return res;});}
  var inicio=dados.perfilAlterado
    ?fotosDe(dados.perfil[pf.k]).then(function(fs){return enviar({perfilFotos:fs,registros:[]});}).then(function(){dados.perfilAlterado=false;guardar();})
    :Promise.resolve();
  function proximo(){var r=fila.shift();if(!r)return;var s=sec(r.secao),cf=campoFoto(s);
    if(st)st.textContent="Enviando "+(feitos+1)+" de "+total+"…";
    return fotosDe(cf&&r.campos[cf.k]).then(function(fs){
      return enviar({registros:[{id:r.id,secao:s.nome,criado:r.criado,fotos:fs,
        campos:s.campos.map(function(c){return[c.r,c.foto?"":valorTela(c,r.campos[c.k]||"")];})}]});})
      .then(function(){r.enviado=true;feitos++;guardar();}).then(proximo);}
  inicio.then(proximo)
   .then(function(){if(st)st.textContent="Enviado! "+feitos+" anotação(ões).";})
   .catch(function(){if(st)st.textContent=(feitos?"Enviei "+feitos+" de "+total+". ":"")+"Não deu para enviar agora. Confira o endereço ou tente mais tarde.";})
   .then(function(){enviando=false;if(tela.nome==="inicio"||tela.nome==="lista")render();});
}
window.addEventListener("online",function(){sincronizar();});

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-falar],[data-ir],[data-abrir],[data-novo],[data-chip],[data-data],[data-ditar],[data-limpar],[data-voltar],[data-proximo],[data-passo],[data-salvar],[data-editar],[data-apagar],[data-apagar-sim],[data-sincronizar],[data-copiar],[data-tirar-foto]");
  if(!el)return;var d=el.dataset;
  if(d.falar!==undefined){ev.stopPropagation();ev.preventDefault();falar(falas[+d.falar],el);return;}
  if(d.ir){ir({nome:d.ir});return;}
  if(d.abrir){abrir(d.abrir);return;}
  if(d.novo){novo(d.novo);return;}
  if(d.chip!==undefined){var c=campoAtual(),t=$("#resposta");rascunho[c.k]=d.chip;if(t)t.value=d.chip;
    document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("marcado",x===el);});falar(d.chip);return;}
  if(d.data){rascunho[campoAtual().k]=d.data;render();falar(dataFala(d.data));return;}
  if(d.ditar!==undefined){ditar();return;}
  if(d.limpar!==undefined){var t2=$("#resposta");t2.value="";rascunho[campoAtual().k]="";t2.focus();return;}
  if(d.voltar!==undefined){lerCampo();
    if(tela.nome==="revisao")ir({nome:"pergunta",secao:tela.secao,passo:sec(tela.secao).campos.length-1,editando:tela.editando});
    else if(tela.passo>0)ir({nome:"pergunta",secao:tela.secao,passo:tela.passo-1,editando:tela.editando});
    else ir(sec(tela.secao).unico?{nome:"inicio"}:{nome:"lista",secao:tela.secao});return;}
  if(d.proximo!==undefined){lerCampo();var s=sec(tela.secao);
    if(tela.passo<s.campos.length-1)ir({nome:"pergunta",secao:tela.secao,passo:tela.passo+1,editando:tela.editando});
    else ir({nome:"revisao",secao:tela.secao,editando:tela.editando});return;}
  if(d.passo!==undefined){ir({nome:"pergunta",secao:tela.secao,passo:+d.passo,editando:tela.editando});return;}
  if(d.salvar!==undefined){salvar();return;}
  if(d.tirarFoto){var cf=campoAtual();rascunho[cf.k]=(rascunho[cf.k]||[]).filter(function(x){return x!==d.tirarFoto;});render();falar("Foto tirada.");return;}
  if(d.editar){var r=dados.registros.filter(function(x){return x.id===d.editar;})[0];rascunho=copia(r.campos);ir({nome:"pergunta",secao:r.secao,passo:0,editando:r.id});return;}
  if(d.apagar){confirmaApagar=d.apagar;render();falar("Quer mesmo apagar? Toque em Sim, apagar.");return;}
  if(d.apagarSim){var ra=dados.registros.filter(function(x){return x.id===d.apagarSim;})[0];
    if(ra)Object.keys(ra.campos).forEach(function(k){if(Array.isArray(ra.campos[k]))ra.campos[k].forEach(fotoDel);});
    dados.registros=dados.registros.filter(function(x){return x.id!==d.apagarSim;});guardar();confirmaApagar=null;render();falar("Apagado.");return;}
  if(d.sincronizar!==undefined){dados.config.url=($("#url-planilha").value||"").trim();guardar();sincronizar(true);return;}
  if(d.copiar!==undefined){var ta=$("#csv");try{navigator.clipboard.writeText(ta.value).then(function(){el.textContent="Copiado!";},function(){ta.select();});}catch(e){ta.select();}return;}
});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList.contains("bloco-ouvir")){ev.preventDefault();ev.target.click();}});
document.addEventListener("input",function(ev){
  if(ev.target.id==="resposta")rascunho[campoAtual().k]=ev.target.value;
  if(ev.target.id==="resposta-data"&&ev.target.value){rascunho[campoAtual().k]=ev.target.value;render();falar(dataFala(ev.target.value));}
});
document.addEventListener("change",function(ev){
  if(ev.target.hasAttribute&&ev.target.hasAttribute("data-arquivo")){
    var c=campoAtual(),lista=Array.prototype.slice.call(ev.target.files||[]),ids=(rascunho[c.k]||[]).slice();
    lista=lista.slice(0,MAX_FOTOS-ids.length);if(!lista.length)return;
    var av=$("#aviso-foto");if(av){av.textContent="Guardando a foto…";av.hidden=false;}
    Promise.all(lista.map(function(fl){return comprimir(fl).then(function(u){var id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);return fotoPut(id,u).then(function(){return id;});});}))
      .then(function(novos){rascunho[c.k]=ids.concat(novos);render();falar(novos.length>1?"Fotos guardadas.":"Foto guardada.");})
      .catch(function(){if(av){av.textContent="Não consegui abrir essa foto. Tente de novo.";av.hidden=false;}});
    return;}
  if(ev.target.id==="ler-sempre"){dados.config.lerSempre=ev.target.checked;guardar();}
  if(ev.target.id==="url-planilha"){dados.config.url=ev.target.value.trim();guardar();}
});

/* ---------- exemplo na primeira abertura (marcado como exemplo) ---------- */
if(!dados.registros.length&&!dados.exemploMostrado){
  dados.exemploMostrado=true;
  dados.registros.push({id:"exemplo1",secao:"plantio",campos:{cultura:"Alface (exemplo)",data:iso(diaMenos(1)),quantidade:"2 bandejas",talhao:"Talhão 1"},criado:new Date().toISOString(),enviado:true});
  guardar();
}
render();
sincronizar();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host)){
  navigator.serviceWorker.register("sw.js").catch(function(){});}
})();
</script>
